<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Удостоверение личности</title>

  <!-- PWA Manifest & Icons Link -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    /* 1. СТИЛИ И СБРОС */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background-color: #ffffff;
      color: #1c1c1e;
      height: 100%;
      width: 100%;
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* Шапка приложения */
    .app-header {
      position: sticky;
      top: 0;
      background: #ffffff;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-bottom: 1px solid #f2f2f7;
      z-index: 10;
    }

    .back-btn {
      position: absolute;
      left: 16px;
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      color: #0055D4;
    }

    .header-title {
      font-size: 17px;
      font-weight: 600;
      color: #000000;
    }

    /* Основной контейнер */
    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* Переключатель вкладок */
    .tab-switcher {
      display: flex;
      background-color: #eeeeee;
      border-radius: 10px;
      padding: 2px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      border: none;
      background: transparent;
      color: #666666;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #000000;
      font-weight: 600;
      box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.08);
    }

    /* Содержимое вкладок */
    .tab-content {
      display: none;
      flex-direction: column;
      flex: 1;
    }

    .tab-content.active {
      display: flex;
    }

    /* ВКЛАДКА 1: ДОКУМЕНТ */
    .image-upload-wrapper {
      width: 100%;
      min-height: 220px;
      border: 2px dashed #d1d1d6;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #fafafa;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
    }

    .upload-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #8e8e93;
      padding: 20px;
      text-align: center;
    }

    .upload-placeholder svg {
      margin-bottom: 8px;
      fill: #8e8e93;
    }

    .preview-img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: none;
      border-radius: 12px;
    }

    #fileInput {
      display: none;
    }

    .actions-group {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-bottom: 12px;
    }

    .btn {
      width: 100%;
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s ease;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-primary {
      background-color: #0055D4;
      color: #ffffff;
    }

    .btn-outline {
      background-color: #ffffff;
      color: #0055D4;
      border-color: #0055D4;
    }

    /* ВКЛАДКА 2: РЕКВИЗИТЫ */
    .fields-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .field-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f2f2f7;
      padding-bottom: 8px;
    }

    .field-info {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding-right: 12px;
    }

    .field-label {
      font-size: 12px;
      color: #8e8e93;
      margin-bottom: 2px;
    }

    .field-input {
      font-size: 16px;
      font-weight: 500;
      color: #000000;
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
    }

    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      color: #0055D4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* МОДАЛЬНОЕ ОКНО (BOTTOM SHEET) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .bottom-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 24px 20px 32px 20px;
      position: relative;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .modal-overlay.active .bottom-sheet {
      transform: translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #f2f2f7;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #8e8e93;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      margin-top: 8px;
    }

    .sheet-subtitle {
      font-size: 14px;
      color: #8e8e93;
      margin-bottom: 24px;
    }

    .qr-container {
      width: 200px;
      height: 200px;
      margin-bottom: 20px;
    }

    .qr-container svg {
      width: 100%;
      height: 100%;
    }

    .code-box {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #000000;
    }

    /* TOAST УВЕДОМЛЕНИЕ */
    .toast {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: rgba(30, 30, 30, 0.9);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* СТИЛИ ДЛЯ ПЕЧАТИ / PDF */
    @media print {
      .app-header, .tab-switcher, .actions-group, .copy-btn, .modal-overlay {
        display: none !important;
      }
      body {
        padding: 0;
      }
      .container {
        max-width: 100%;
        padding: 0;
      }
      .tab-content {
        display: block !important;
      }
      .image-upload-wrapper {
        border: none;
      }
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <header class="app-header">
    <button class="back-btn" onclick="window.location.href='https://kaspi.kz'" aria-label="Назад">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>
    <h1 class="header-title">Удостоверение личности</h1>
  </header>

  <!-- Основная часть -->
  <main class="container">
    <!-- Табы -->
    <nav class="tab-switcher">
      <button class="tab-btn active" onclick="switchTab('doc')">Документ</button>
      <button class="tab-btn" onclick="switchTab('req')">Реквизиты</button>
    </nav>

    <!-- Вкладка 1: Документ -->
    <section id="tab-doc" class="tab-content active">
      <div class="image-upload-wrapper" onclick="triggerFileInput()">
        <div class="upload-placeholder" id="uploadPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24">
            <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5-7l-3 3.72L9 13l-3 4h12l-4-5z"/>
          </svg>
          <span>Нажмите для загрузки фото</span>
        </div>
        <img id="previewImg" class="preview-img" alt="Удостоверение личности">
      </div>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

      <div class="actions-group">
        <button class="btn btn-primary" onclick="openModal()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          Предъявить документ
        </button>
        <button class="btn btn-outline" onclick="shareOrPrint()">
          Отправить документ
        </button>
      </div>
    </section>

    <!-- Вкладка 2: Реквизиты -->
    <section id="tab-req" class="tab-content">
      <div class="fields-list">
        
        <div class="field-row">
          <div class="field-info">
            <span class="field-label">ФИО</span>
            <input type="text" id="field-fio" class="field-input" placeholder="Иванов Иван Иванович" oninput="saveField('fio', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-fio')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field-info">
            <span class="field-label">ИИН</span>
            <input type="text" id="field-iin" class="field-input" placeholder="000000000000" oninput="saveField('iin', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-iin')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field-info">
            <span class="field-label">Дата рождения</span>
            <input type="text" id="field-birth" class="field-input" placeholder="01.01.2000" oninput="saveField('birth', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-birth')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field-info">
            <span class="field-label">Номер документа</span>
            <input type="text" id="field-docnum" class="field-input" placeholder="N00000000" oninput="saveField('docnum', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-docnum')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field-info">
            <span class="field-label">Дата выдачи</span>
            <input type="text" id="field-issue" class="field-input" placeholder="01.01.2020" oninput="saveField('issue', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-issue')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

        <div class="field-row">
          <div class="field-info">
            <span class="field-label">Срок действия</span>
            <input type="text" id="field-expiry" class="field-input" placeholder="01.01.2030" oninput="saveField('expiry', this.value)">
          </div>
          <button class="copy-btn" onclick="copyField('field-expiry')" aria-label="Копировать">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
        </div>

      </div>

      <div class="actions-group">
        <button class="btn btn-outline" onclick="shareOrPrint()">
          Отправить реквизиты
        </button>
      </div>
    </section>
  </main>

  <!-- Модальное окно (Bottom Sheet) -->
  <div id="modalOverlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModal()" aria-label="Закрыть">✕</button>
      <h2 class="sheet-title">Удостоверение личности</h2>
      <p class="sheet-subtitle">Покажите QR-код сотруднику</p>
      
      <div class="qr-container">
        <!-- Генерация динамического векторного QR-кода -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges">
          <path fill="#ffffff" d="M0 0h29v29H0z"/>
          <path fill="#000000" d="M0 0h7v7H0zm1 1v5h5V1zM2 2h3v3H2zm7 0h2v1H9zm3 0h1v2h-1zm2 0h2v1h-2zm4 0h7v7h-7zm1 1v5h5V3zm1 1h3v3h-3zM0 9h1v2H0zm2 0h3v1H2zm4 0h1v1H6zm4 0h3v1h-3zm5 0h1v1h-1zm2 0h2v1h-2zm0 2h1v1h-1zm-8 1h1v1h-1zm3 0h2v1h-2zm6 0h1v1h-1zm-17 2h2v1H0zm4 0h1v1H4zm5 0h1v1H9zm3 0h1v1h-1zm3 0h2v1h-2zm-14 2h1v1H1zm3 0h1v1H4zm4 0h2v1H8zm5 0h1v1h-1zm2 0h1v1h-1zm2 0h1v1h-1zm2 0h2v1h-2zm-19 2h7v7H0zm1 1v5h5v-5zm1 1h3v3H2zm8 0h1v1h-1zm3 0h1v2h-1zm2 0h3v1h-3zm-4 2h1v1h-1zm3 0h2v1h-2zm2 0h1v1h-1zm-6 2h2v1h-2zm3 0h1v1h-1zm3 0h2v1h-2z"/>
        </svg>
      </div>

      <div class="code-box">100823</div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">Скопировано в буфер обмена</div>

  <!-- JS ЛОГИКА -->
  <script>
    // 1. Переключение вкладок
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      if (tabName === 'doc') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-doc').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-req').classList.add('active');
      }
    }

    // 2. Работа с фотографией документа
    function triggerFileInput() {
      document.getElementById('fileInput').click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64Image = e.target.result;
          displayImage(base64Image);
          localStorage.setItem('kaspi_doc_image', base64Image);
        };
        reader.readAsDataURL(file);
      }
    }

    function displayImage(src) {
      const imgEl = document.getElementById('previewImg');
      const placeholder = document.getElementById('uploadPlaceholder');
      imgEl.src = src;
      imgEl.style.display = 'block';
      placeholder.style.display = 'none';
    }

    // 3. Сохранение и загрузка полей реквизитов
    const fieldKeys = ['fio', 'iin', 'birth', 'docnum', 'issue', 'expiry'];

    function saveField(key, value) {
      localStorage.setItem('kaspi_req_' + key, value);
    }

    function loadData() {
      // Восстановление фото
      const savedImg = localStorage.getItem('kaspi_doc_image');
      if (savedImg) {
        displayImage(savedImg);
      }

      // Восстановление реквизитов
      fieldKeys.forEach(key => {
        const savedVal = localStorage.getItem('kaspi_req_' + key);
        if (savedVal !== null) {
          const inputEl = document.getElementById('field-' + key);
          if (inputEl) inputEl.value = savedVal;
        }
      });
    }

    // 4. Копирование в буфер обмена
    function copyField(inputId) {
      const input = document.getElementById(inputId);
      if (input && input.value) {
        navigator.clipboard.writeText(input.value).then(() => {
          showToast();
        }).catch(err => {
          // Запасной вариант для старых браузеров
          input.select();
          document.execCommand('copy');
          showToast();
        });
      }
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // 5. Модальное окно (Bottom Sheet)
    function openModal() {
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(event) {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // 6. Поделиться или Печать/PDF
    function shareOrPrint() {
      if (navigator.share) {
        const activeTab = document.getElementById('tab-doc').classList.contains('active') ? 'Документ' : 'Реквизиты';
        navigator.share({
          title: 'Удостоверение личности',
          text: activeTab === 'Реквизиты' ? getShareableText() : 'Удостоверение личности Kaspi',
          url: window.location.href
        }).catch(() => {});
      } else {
        window.print();
      }
    }

    function getShareableText() {
      let text = 'Реквизиты удостоверения личности:\n';
      fieldKeys.forEach(key => {
        const el = document.getElementById('field-' + key);
        if (el && el.value) {
          const label = el.previousElementSibling.textContent;
          text += `${label}: ${el.value}\n`;
        }
      });
      return text;
    }

    // 7. Регистрация Service Worker для PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    // Инициализация данных при загрузке страницы
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
