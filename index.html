<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0055D4">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Удостоверение">
    <title>Удостоверение личности</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        .mobile-frame {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04), 0 0 0 12px #1f2937;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        .toast-animate {
            animation: fadeInOut 2.5s forwards;
        }

        @keyframes modalSlideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-animate {
            animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Print styles for PDF export */
        @media print {
            body { background: white !important; }
            .mobile-frame { box-shadow: none !important; border: none !important; width: 100% !important; height: auto !important; }
            header, .px-4.py-3, #qr-modal, button { display: none !important; }
            #tab-doc, #tab-req { display: block !important; }
            input { border: none !important; background: transparent !important; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4">
    <!-- Mobile Container Frame -->
    <div class="mobile-frame w-full sm:w-[410px] h-[100vh] sm:h-[840px] bg-[#f2f2f7] sm:rounded-[40px] flex flex-col overflow-hidden relative border-0 sm:border border-gray-300">
        
        <!-- Header -->
        <header class="bg-[#f2f2f7] pt-4 px-4 pb-2 flex items-center justify-between border-b border-gray-200/50 shrink-0 select-none">
            <!-- Back Arrow Redirecting to Kaspi -->
            <a href="https://kaspi.kz" class="w-10 h-10 flex items-center justify-start text-gray-800 active:opacity-60 text-xl transition-opacity">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <h1 class="font-semibold text-[17px] text-gray-900 tracking-tight text-center flex-1">
                Удостоверение личности
            </h1>
            <div class="w-10"></div>
        </header>

        <!-- Segmented Control Tabs -->
        <div class="px-4 py-3 shrink-0">
            <div class="bg-[#e3e3e8] p-1 rounded-xl flex items-center relative text-sm font-medium">
                <button id="tab-doc-btn" onclick="switchTab('doc')" class="w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-900 bg-white shadow-sm">
                    Документ
                </button>
                <button id="tab-req-btn" onclick="switchTab('req')" class="w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-600">
                    Реквизиты
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <main class="flex-1 overflow-y-auto no-scrollbar px-4 pb-6 flex flex-col justify-between">
            
            <!-- TAB 1: Документ -->
            <div id="tab-doc" class="flex-1 flex flex-col justify-between">
                <div class="flex-1 flex flex-col items-center justify-center py-4">
                    <!-- Document Card / Upload Area -->
                    <div class="w-full bg-white rounded-2xl shadow-sm border border-gray-200/80 overflow-hidden relative group transition-all">
                        
                        <!-- Uploaded Image Preview / Placeholder -->
                        <div id="image-container" class="relative aspect-[3/2] w-full bg-gray-100 flex flex-col items-center justify-center overflow-hidden cursor-pointer">
                            <div id="upload-placeholder" class="flex flex-col items-center justify-center p-6 text-center">
                                <div class="w-16 h-16 rounded-full bg-blue-50 text-[#0055D4] flex items-center justify-center mb-3">
                                    <i class="fa-solid fa-id-card text-2xl"></i>
                                </div>
                                <p class="text-sm font-semibold text-gray-700">Нажмите для загрузки фото</p>
                                <p class="text-xs text-gray-400 mt-1">или перетащите файл сюда</p>
                            </div>

                            <img id="document-img" src="" alt="Документ" class="w-full h-full object-cover hidden" />

                            <div id="image-overlay" class="absolute inset-0 bg-black/40 opacity-0 hover:opacity-100 transition-opacity flex items-center justify-center gap-3 hidden">
                                <button onclick="triggerFileInput(event)" class="bg-white/90 text-gray-800 p-2.5 rounded-full hover:bg-white transition-colors" title="Изменить фото">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                                <button onclick="removeImage(event)" class="bg-white/90 text-red-600 p-2.5 rounded-full hover:bg-white transition-colors" title="Удалить">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>

                        <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                    </div>

                    <p class="text-xs text-center text-gray-400 mt-3">
                        Вы можете загрузить изображение вашего удостоверения личности для предпросмотра
                    </p>
                </div>

                <!-- Tab 1 Action Buttons -->
                <div class="space-y-3 pt-4 border-t border-gray-200/40">
                    <button onclick="openQrModal()" class="w-full bg-[#0055D4] hover:bg-[#0044B3] active:bg-[#003899] text-white py-3.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2.5 shadow-sm active:scale-[0.99] transition-all">
                        <i class="fa-solid fa-qrcode text-lg"></i>
                        <span>Предъявить документ</span>
                    </button>
                    <button onclick="sharePdfDocument('Документ')" class="w-full bg-transparent border border-[#0055D4] text-[#0055D4] hover:bg-blue-50/50 active:bg-blue-100/50 py-3.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2.5 active:scale-[0.99] transition-all">
                        <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
                        <span>Отправить документ</span>
                    </button>
                </div>
            </div>

            <!-- TAB 2: Реквизиты -->
            <div id="tab-req" class="flex-1 flex flex-col justify-between hidden">
                <div class="space-y-4 py-2">
                    
                    <!-- Field Item: ФИО -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">ФИО</label>
                            <input type="text" id="field-fio" data-key="fio" value="АЛМАБЕКОВ БАУЫРЖАН СЕРИКУЛЫ" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-fio', 'ФИО')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                    <!-- Field Item: ИИН -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">ИИН</label>
                            <input type="text" id="field-iin" data-key="iin" value="950412350184" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-iin', 'ИИН')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                    <!-- Field Item: Дата рождения -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">Дата рождения</label>
                            <input type="text" id="field-dob" data-key="dob" value="12.04.1995" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-dob', 'Дата рождения')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                    <!-- Field Item: Номер документа -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">Номер документа</label>
                            <input type="text" id="field-docnum" data-key="docnum" value="048392019" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-docnum', 'Номер документа')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                    <!-- Field Item: Дата выдачи -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">Дата выдачи</label>
                            <input type="text" id="field-issue" data-key="issue" value="18.05.2020" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-issue', 'Дата выдачи')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                    <!-- Field Item: Срок действия -->
                    <div class="flex items-center justify-between border-b border-gray-200/60 pb-2.5">
                        <div class="flex-1 pr-2">
                            <label class="block text-xs text-gray-400 font-normal mb-0.5">Срок действия</label>
                            <input type="text" id="field-expiry" data-key="expiry" value="17.05.2030" 
                                class="w-full bg-transparent font-medium text-gray-900 text-sm focus:outline-none focus:border-b-2 focus:border-[#0055D4] py-0.5 transition-colors" 
                                oninput="saveFieldData(this)" />
                        </div>
                        <button onclick="copyToClipboard('field-expiry', 'Срок действия')" class="text-gray-400 hover:text-gray-600 p-2 active:scale-95 transition-transform">
                            <i class="fa-regular fa-copy text-lg"></i>
                        </button>
                    </div>

                </div>

                <!-- Tab 2 Action Button -->
                <div class="pt-4 border-t border-gray-200/40">
                    <button onclick="sharePdfDocument('Реквизиты')" class="w-full bg-transparent border border-[#0055D4] text-[#0055D4] hover:bg-blue-50/50 active:bg-blue-100/50 py-3.5 px-4 rounded-xl font-medium flex items-center justify-center gap-2.5 active:scale-[0.99] transition-all">
                        <i class="fa-solid fa-arrow-up-from-bracket text-base"></i>
                        <span>Отправить реквизиты</span>
                    </button>
                </div>
            </div>

        </main>

        <!-- QR MODAL (Matches 3rd Image) -->
        <div id="qr-modal" class="absolute inset-0 bg-black/40 backdrop-blur-xs z-50 flex flex-col justify-end hidden">
            <!-- Backdrop Click Area -->
            <div class="flex-1" onclick="closeQrModal()"></div>
            
            <!-- Modal Content Sheet -->
            <div class="bg-white rounded-t-[28px] px-6 pt-3 pb-8 w-full modal-animate flex flex-col items-center relative">
                <!-- Top Notch Handle -->
                <div class="w-9 h-1 bg-gray-300 rounded-full mb-4"></div>

                <!-- Modal Header -->
                <div class="w-full flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-900">Удостоверение личности</h3>
                    <button onclick="closeQrModal()" class="text-gray-400 hover:text-gray-600 p-1 text-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- Instructions -->
                <p class="text-gray-500 text-sm mb-6 text-center">Покажите QR-код сотруднику</p>

                <!-- QR Code Holder -->
                <div class="bg-white p-3 rounded-xl border border-gray-100 shadow-xs mb-6 flex items-center justify-center">
                    <div id="qrcode-box" class="w-48 h-48"></div>
                </div>

                <!-- Random Code Display -->
                <p class="text-gray-500 text-sm mb-1 text-center">или скажите код</p>
                <div id="code-display" class="text-3xl font-extrabold text-gray-900 tracking-wider">
                    100823
                </div>
            </div>
        </div>

        <!-- Dynamic Toast Notification Container -->
        <div id="toast-container" class="absolute bottom-20 left-1/2 -translate-x-1/2 pointer-events-none z-50"></div>
    </div>
</div>

<script>
    // Tab Switcher Logic
    function switchTab(tab) {
        const docBtn = document.getElementById('tab-doc-btn');
        const reqBtn = document.getElementById('tab-req-btn');
        const docTab = document.getElementById('tab-doc');
        const reqTab = document.getElementById('tab-req');

        if (tab === 'doc') {
            docBtn.className = "w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-900 bg-white shadow-sm";
            reqBtn.className = "w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-600";
            docTab.classList.remove('hidden');
            reqTab.classList.add('hidden');
        } else {
            reqBtn.className = "w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-900 bg-white shadow-sm";
            docBtn.className = "w-1/2 py-2 text-center rounded-lg transition-all duration-200 z-10 font-medium text-gray-600";
            reqTab.classList.remove('hidden');
            docTab.classList.add('hidden');
        }
    }

    // QR Code Modal Handling
    let qrcodeObj = null;

    function openQrModal() {
        const modal = document.getElementById('qr-modal');
        const qrcodeBox = document.getElementById('qrcode-box');
        const codeDisplay = document.getElementById('code-display');

        // Generate Random 6-Digit Code like 100823
        const randomCode = Math.floor(100000 + Math.random() * 900000);
        codeDisplay.innerText = randomCode;

        // Clear and rebuild QR Code
        qrcodeBox.innerHTML = '';
        const iin = document.getElementById('field-iin').value || "950412350184";
        
        qrcodeObj = new QRCode(qrcodeBox, {
            text: `DOCUMENT_VERIFY_CODE:${randomCode}:${iin}`,
            width: 192,
            height: 192,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        modal.classList.remove('hidden');
    }

    function closeQrModal() {
        document.getElementById('qr-modal').classList.add('hidden');
    }

    // Share / Send PDF Document Simulator
    function sharePdfDocument(type = 'Документ') {
        showToast('Формирование PDF файла...');
        
        setTimeout(() => {
            const iin = document.getElementById('field-iin').value;
            const fio = document.getElementById('field-fio').value;
            const shareData = {
                title: `${type} - Удостоверение личности`,
                text: `Удостоверение личности (${type}): ${fio}, ИИН: ${iin}`,
                url: window.location.href
            };

            if (navigator.share && navigator.canShare && navigator.canShare(shareData)) {
                navigator.share(shareData).catch(() => {
                    window.print();
                });
            } else {
                window.print();
            }
        }, 500);
    }

    // Image Upload Logic
    const imageContainer = document.getElementById('image-container');
    const fileInput = document.getElementById('file-input');
    const documentImg = document.getElementById('document-img');
    const uploadPlaceholder = document.getElementById('upload-placeholder');
    const imageOverlay = document.getElementById('image-overlay');

    imageContainer.addEventListener('click', () => {
        if (documentImg.classList.contains('hidden')) {
            fileInput.click();
        }
    });

    function triggerFileInput(e) {
        e.stopPropagation();
        fileInput.click();
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                documentImg.src = e.target.result;
                documentImg.classList.remove('hidden');
                uploadPlaceholder.classList.add('hidden');
                imageOverlay.classList.remove('hidden');
                
                try {
                    localStorage.setItem('egov_doc_img', e.target.result);
                } catch (err) {
                    console.warn('Storage limit exceeded for image');
                }
            };
            reader.readAsDataURL(file);
        }
    }

    function removeImage(e) {
        e.stopPropagation();
        documentImg.src = '';
        documentImg.classList.add('hidden');
        uploadPlaceholder.classList.remove('hidden');
        imageOverlay.classList.add('hidden');
        fileInput.value = '';
        localStorage.removeItem('egov_doc_img');
        showToast('Изображение удалено');
    }

    // Local Storage for Text Fields
    function saveFieldData(inputElement) {
        const key = inputElement.getAttribute('data-key');
        const value = inputElement.value;
        localStorage.setItem(`egov_field_${key}`, value);
    }

    function loadSavedData() {
        const savedImg = localStorage.getItem('egov_doc_img');
        if (savedImg) {
            documentImg.src = savedImg;
            documentImg.classList.remove('hidden');
            uploadPlaceholder.classList.add('hidden');
            imageOverlay.classList.remove('hidden');
        }

        const fields = document.querySelectorAll('input[data-key]');
        fields.forEach(input => {
            const key = input.getAttribute('data-key');
            const savedValue = localStorage.getItem(`egov_field_${key}`);
            if (savedValue !== null) {
                input.value = savedValue;
            }
        });
    }

    // Copy to Clipboard Utility
    function copyToClipboard(elementId, label) {
        const input = document.getElementById(elementId);
        if (!input) return;

        const textToCopy = input.value;

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(`${label} скопировано`);
            }).catch(() => {
                fallbackCopy(textToCopy, label);
            });
        } else {
            fallbackCopy(textToCopy, label);
        }
    }

    function fallbackCopy(text, label) {
        const tempInput = document.createElement('input');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(`${label} скопировано`);
    }

    // Toast UI Generator
    function showToast(message) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg border border-gray-700/50 backdrop-blur-sm flex items-center gap-2 whitespace-nowrap toast-animate';
        toast.innerHTML = `<i class="fa-solid fa-check text-green-400"></i> <span>${message}</span>`;

        container.appendChild(toast);

        setTimeout(() => {
            toast.remove();
        }, 2500);
    }

    window.onload = function() {
        loadSavedData();
    };
    if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log('Service Worker зарегистрирован'))
      .catch((err) => console.log('Ошибка SW:', err));
  }
</script>
</html>
